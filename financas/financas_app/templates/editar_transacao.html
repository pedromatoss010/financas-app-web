{% extends "base.html" %}
{% block title %}Editar transação{% endblock %}

{% block content %}
    <div class="card" style="max-width: 480px;">
        <h2 style="margin-bottom: 0.5rem;">Editar transação</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <label>Tipo</label>
            <select name="tipo">
                <option value="entrada" {% if t.tipo == "entrada" %}selected{% endif %}>Entrada</option>
                <option value="saida" {% if t.tipo == "saida" %}selected{% endif %}>Saída</option>
            </select>

            <label>Valor</label>
            <input type="number" step="0.01" name="valor" value="{{ t.valor }}" required>

            <label>Categoria</label>
            <input type="text" name="categoria" value="{{ t.categoria }}" required>

            <label>Descrição</label>
            <input type="text" name="descricao" value="{{ t.descricao }}">

            <button type="submit">Salvar alterações</button>
        </form>
    </div>
{% endblock %}
